<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>图片展示</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; }
    body { background: #111; color: #fff; font-family: system-ui, sans-serif; }
    main {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
               env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    img {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100vh;
      max-height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
      object-fit: contain;
    }
    #clock {
      display: none;
      position: fixed;
      z-index: 1;
      overflow: hidden;
      background: #fff;
      color: #303030;
      font-family: Arial, sans-serif;
      font-weight: 400;
      line-height: 1;
      align-items: center;
      white-space: nowrap;
      pointer-events: none;
    }
    #error { display: none; padding: 24px; text-align: center; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <img id="display-image" src="assets/display-image.jpg" alt="展示图片" fetchpriority="high">
    <time id="clock" aria-label="当前北京时间"></time>
    <p id="error" role="alert">图片加载失败，请稍后刷新页面。</p>
  </main>
  <script>
    (function () {
      var image = document.getElementById('display-image');
      var clock = document.getElementById('clock');
      var error = document.getElementById('error');
      function updateClock() {
        var now = new Date(Date.now() + 8 * 60 * 60 * 1000);
        var hours = ('0' + now.getUTCHours()).slice(-2);
        var minutes = ('0' + now.getUTCMinutes()).slice(-2);
        clock.textContent = hours + ':' + minutes;
        clock.dateTime = hours + ':' + minutes;
      }
      function positionClock() {
        if (!image.naturalWidth) return;
        var rect = image.getBoundingClientRect();
        var scale = rect.width / image.naturalWidth;
        clock.style.left = rect.left + 40 * scale + 'px';
        clock.style.top = rect.top + 'px';
        clock.style.width = 125 * scale + 'px';
        clock.style.height = 51 * scale + 'px';
        clock.style.paddingLeft = 10 * scale + 'px';
        clock.style.fontSize = 38 * scale + 'px';
        clock.style.display = 'flex';
      }
      function showError() {
        image.style.display = 'none';
        clock.style.display = 'none';
        error.style.display = 'block';
      }
      image.onerror = showError;
      image.onload = positionClock;
      window.addEventListener('resize', positionClock);
      updateClock();
      setInterval(updateClock, 1000);
      var version = new URLSearchParams(window.location.search).get('v');
      if (version) image.src = 'assets/display-image.jpg?v=' + encodeURIComponent(version);
      if (image.complete) image.naturalWidth ? positionClock() : showError();
    }());
  </script>
</body>
</html>
